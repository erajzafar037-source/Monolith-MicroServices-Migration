version: '3.8'
services:
 
  gateway:
    build: ./gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro 
    depends_on:
      - monolith
      - order-service

  monolith:
    build: .
    environment:
      - FLASK_ENV=development

  order-service:
    build: ./order-service
    
